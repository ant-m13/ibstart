name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "tools/update-1c-reference.py"
      - "tools/update-launch-parameter-versions.py"
      - "tools/tests/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "tools/update-1c-reference.py"
      - "tools/update-launch-parameter-versions.py"
      - "tools/tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Prepare changelog page
        shell: bash
        run: cp CHANGELOG.md docs/changelog.md

      - name: Check reference documentation
        run: |
          python tools/update-1c-reference.py --check
          python tools/update-launch-parameter-versions.py --check-docs
          python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Build site
        run: mkdocs build --strict

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
