name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure and build
        run: |
          cmake -S . -B out/build/release -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
          cmake --build out/build/release --config Release --parallel
          ctest --test-dir out/build/release -C Release --output-on-failure
      - name: Package and checksum
        shell: pwsh
        run: |
          $exe = Get-Item out/build/release/Release/IBStart.exe
          if ($exe.Length -gt 8388608) { throw "IBStart.exe exceeds 8 MiB" }
          Compress-Archive -Path $exe.FullName,README.md,LICENSE,CHANGELOG.md -DestinationPath out/build/release/IBStart-windows-x64.zip
          (Get-FileHash $exe -Algorithm SHA256).Hash + "  IBStart.exe" | Out-File -Encoding ascii out/build/release/checksums.txt
          (Get-FileHash out/build/release/IBStart-windows-x64.zip -Algorithm SHA256).Hash + "  IBStart-windows-x64.zip" | Add-Content -Encoding ascii out/build/release/checksums.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            out/build/release/Release/IBStart.exe
            out/build/release/IBStart-windows-x64.zip
            out/build/release/checksums.txt
