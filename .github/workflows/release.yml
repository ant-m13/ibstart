name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure MSVC environment
        shell: pwsh
        run: ./.github/scripts/setup-msvc.ps1
      - name: Configure and build
        run: |
          cmake -S . -B out/build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build out/build/release --parallel
          ctest --test-dir out/build/release --output-on-failure
      - name: Package and checksum
        shell: pwsh
        run: |
          $exe = Get-Item out/build/release/IBStart.exe
          if ($exe.Length -gt 8388608) { throw "IBStart.exe exceeds 8 MiB" }
          Compress-Archive -Path $exe.FullName,README.md,LICENSE,CHANGELOG.md -DestinationPath out/build/release/IBStart-windows-x64.zip
          (Get-FileHash $exe -Algorithm SHA256).Hash + "  IBStart.exe" | Out-File -Encoding ascii out/build/release/checksums.txt
          (Get-FileHash out/build/release/IBStart-windows-x64.zip -Algorithm SHA256).Hash + "  IBStart-windows-x64.zip" | Add-Content -Encoding ascii out/build/release/checksums.txt
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME
          $files = @(
            "out/build/release/IBStart.exe",
            "out/build/release/IBStart-windows-x64.zip",
            "out/build/release/checksums.txt"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to update release assets for $tag." }
            gh release edit $tag --title $tag --notes-file CHANGELOG.md
            if ($LASTEXITCODE -ne 0) { throw "Failed to update release notes for $tag." }
          } else {
            gh release create $tag $files --verify-tag --title $tag --notes-file CHANGELOG.md
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag." }
          }
