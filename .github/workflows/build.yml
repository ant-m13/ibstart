name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate product version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $version = (./.github/scripts/read-version.ps1).Trim()
          $tag = "v$version"
          $null = ./.github/scripts/read-changelog-section.ps1 -Version $version
          if ($env:EVENT_NAME -eq "pull_request") {
            $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Unable to check whether tag $tag already exists." }
            if ($remoteTag) { throw "Version $version has already been released as $tag. Increment cmake/IBStartVersion.cmake." }
          }
          "version=$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "### IBStart $version" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - name: Configure MSVC environment
        shell: pwsh
        run: ./.github/scripts/setup-msvc.ps1
      - name: Configure CMake
        run: cmake -S . -B out/build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Verify visual styles manifest
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw out/build/ci/generated/app.manifest
          if ($manifest -notmatch 'Microsoft\.Windows\.Common-Controls' -or $manifest -notmatch 'version="6\.0\.0\.0"') {
            throw 'IBStart manifest must enable Microsoft.Windows.Common-Controls v6 for alpha-aware icons and button image lists.'
          }
      - name: Build Release
        run: cmake --build out/build/ci --parallel
      - name: Verify embedded visual styles manifest
        shell: pwsh
        run: |
          $embedded = 'out/build/ci/embedded.manifest'
          & mt.exe -nologo '-inputresource:out/build/ci/IBStart.exe;#1' "-out:$embedded"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract the embedded application manifest.' }
          $manifest = Get-Content -Raw $embedded
          if ($manifest -notmatch 'Microsoft\.Windows\.Common-Controls' -or $manifest -notmatch 'version="6\.0\.0\.0"') {
            throw 'IBStart.exe must embed Microsoft.Windows.Common-Controls v6.'
          }
      - name: Run CTest
        run: ctest --test-dir out/build/ci --output-on-failure
      - name: Verify binary size
        shell: pwsh
        env:
          IBSTART_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $file = Get-Item out/build/ci/IBStart.exe
          $configuredVersion = (Get-Content -Raw out/build/ci/ibstart-version.txt).Trim()
          if ($configuredVersion -ne $env:IBSTART_VERSION) { throw "Configured version '$configuredVersion' does not match '$env:IBSTART_VERSION'." }
          if ($file.Length -gt 8388608) { throw "IBStart.exe exceeds the 8 MiB limit: $($file.Length)" }
          if ($file.VersionInfo.ProductVersion -ne $env:IBSTART_VERSION) { throw "IBStart.exe ProductVersion '$($file.VersionInfo.ProductVersion)' does not match '$env:IBSTART_VERSION'." }
          "IBStart.exe: $($file.Length) bytes" | Out-File -Encoding ascii out/build/ci/checksums.txt
          (Get-FileHash $file -Algorithm SHA256).Hash + "  IBStart.exe" | Add-Content -Encoding ascii out/build/ci/checksums.txt
      - name: Package
        shell: pwsh
        env:
          IBSTART_VERSION: ${{ steps.version.outputs.version }}
        run: Compress-Archive -Path out/build/ci/IBStart.exe,README.md,LICENSE,CHANGELOG.md -DestinationPath "out/build/ci/IBStart-$env:IBSTART_VERSION-windows-x64.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: IBStart-${{ steps.version.outputs.version }}-windows-x64
          path: |
            out/build/ci/IBStart.exe
            out/build/ci/IBStart-${{ steps.version.outputs.version }}-windows-x64.zip
            out/build/ci/checksums.txt
